title: Flatsphere
description: Interactive reprojections of the sphere.
url: https://flatsphere.dev
baseurl: ""
permalink: /blog/:slug/

# Jekyll reads its site data from data/ instead of the default _data/. That directory is a
# regular (published) source directory, so data/projections.json is both site.data.projections
# for the gallery templates and the /data/projections.json the app fetches at runtime — one
# file, no staging copy. Every data file here is parsed at build time and, unless listed in
# `exclude:` below, also published.
data_dir: data

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Disable kramdown's built-in math engine. MathJax 3 (loaded only on posts
# that opt in via `math: true` front matter) scans for $...$ and $$...$$
# delimiters directly, which kramdown would otherwise wrap in
# <script type="math/tex"> tags that MathJax 3 doesn't process by default.
kramdown:
  math_engine: null

collections:
  projections:
    output: true
    permalink: /gallery/:path/

defaults:
  - scope:
      path: ""
      type: projections
    values:
      layout: projection
      nav: gallery
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: blog
      author: rob

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Makefile
  - vendor/
  - "*.pem"
  - server.log
  - .claude/
  # Read as site.data.authors but not served at /data/authors.yml. Excluding a data file stops
  # only its publication, not its loading. Side effect: jekyll serve's watcher ignores excluded
  # paths, so an author edit shows up on the next regeneration triggered by another file.
  - data/authors.yml
